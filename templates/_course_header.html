<!-- Course header shared by all pages -->
<div id="header" style="text-align:center">
  <a href="https://nlp.stanford.edu/">
    <img src="{{ url_for('static', filename='images/Stanford-NLP-stack.jpg') }}" class="logo-left" alt="Stanford NLP Group logo">
  </a>
  <a href="https://www.stanford.edu/">
    <img src="{{ url_for('static', filename='images/stanfordlogo.jpg') }}" class="logo-right" alt="Stanford University logo">
  </a>
  <h1>CS 329Z: Engineering AI Agents</h1>
  <h3>Stanford / Fall 2026</h3>
  <div style="clear:both;"></div>
</div>

{% if announcement.html %}
<!-- Temporary enrollment notice. To remove it sitewide, delete pages/announcement.md;
     the `expires` date in that file hides it automatically on schedule. -->
<div class="container" id="site-notice"{% if announcement.expires_at_ms %} data-expires-at="{{ announcement.expires_at_ms }}"{% endif %}>
  <section class="enrollment-notice" aria-label="Enrollment notice">
    {{ announcement.html|safe }}
  </section>
</div>
{% if announcement.expires_at_ms %}
<script>
  // The site is static, so hide the notice in the browser once its date passes,
  // without waiting for the next deploy. Runs inline, so nothing flashes on screen.
  (function () {
    var el = document.getElementById('site-notice');
    if (el && Date.now() >= Number(el.getAttribute('data-expires-at'))) el.remove();
  })();
</script>
{% endif %}
{% endif %}
