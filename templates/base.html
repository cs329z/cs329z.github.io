<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Stanford CS329Z | Engineering AI Agents{% endblock %}</title>
  <meta name="description" content="{% block description %}Official course website for Stanford CS329Z: Engineering AI Agents — schedule, deadlines, coursework, project, and logistics.{% endblock %}">
  <link rel="canonical" href="{% block canonical %}https://cs329z.stanford.edu/{% endblock %}">
  {% if staging %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:site_name" content="Stanford CS329Z">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/stanford.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ asset_version }}">
</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-default navbar-fixed-top">
  <div class="container">
    <div class="navbar-header">
      <a class="navbar-brand" href="{{ url_for('index') }}">CS329Z Home</a>
      <button type="button" class="navbar-toggle" aria-expanded="false" aria-label="Toggle navigation"
              onclick="var m=document.getElementById('nav-menu');var o=m.classList.toggle('in');this.setAttribute('aria-expanded',o)">
        <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
      </button>
    </div>
    <div class="navbar-collapse" id="nav-menu">
      <ul class="nav navbar-nav navbar-right">
        <li><a href="{{ url_for('index') }}#schedule">Schedule</a></li>
        <li><a href="{{ url_for('index') }}#deadlines">Deadlines</a></li>
        <li><a href="{{ url_for('index') }}#coursework">Coursework</a></li>
        <li><a href="{{ url_for('index') }}#project">Project</a></li>
        <li><a href="{{ url_for('office_hours') }}">Office Hours</a></li>
        <li><a href="{{ url_for('index') }}#logistics">Logistics</a></li>
      </ul>
    </div>
  </div>
</nav>

{% if staging %}
<div style="background:#fff3cd;color:#664d03;border-bottom:1px solid #ffe69c;text-align:center;padding:8px 15px;font-weight:700">
  Staging preview — this is the <code>staging</code> branch, not the live site.
  The live site is at <a href="https://cs329z.stanford.edu/">cs329z.stanford.edu</a>.
</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
